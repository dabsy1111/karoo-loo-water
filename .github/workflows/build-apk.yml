name: Build signed APK

# Builds the extension, signs it with the shared key kept in the LOOWATER_KEYSTORE
# secret, and publishes it as a GitHub release:
#   https://github.com/dabsy1111/karoo-loo-water/releases/latest/download/LooWater.apk
# The Karoo also reads manifest.json from the latest release to offer updates.

on:
  # "Run workflow" button on the Actions tab
  workflow_dispatch:
  # Any change to the app's code or build files
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "karoo-ext/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.LOOWATER_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The LOOWATER_KEYSTORE secret is missing. Add it under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE" | base64 --decode > keystore/loowater.jks

      - name: Build and test
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Check the signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | tee signer.txt
          grep -q "CN=Loo and Water" signer.txt || { echo "::error::APK isn't signed with the shared key"; exit 1; }

      - name: Prepare release files
        id: meta
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/LooWater-$NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk out/LooWater.apk
          cp app/icon.png out/icon.png
          # The Karoo reads this to offer updates (see karoo-ext KarooAppManifest).
          NAME="$NAME" CODE="$CODE" REPO="${{ github.repository }}" python3 - <<'PY'
          import json, os
          base = f"https://github.com/{os.environ['REPO']}/releases/latest/download"
          manifest = {
              "label": "Loo & Water",
              "packageName": "io.github.dan.loowater",
              "iconUrl": f"{base}/icon.png",
              "latestApkUrl": f"{base}/LooWater.apk",
              "latestVersion": os.environ["NAME"],
              "latestVersionCode": int(os.environ["CODE"]),
              "developer": "github.com/dabsy1111",
              "description": "Nearest open public toilet and drinking water, with tap-to-navigate data fields.",
              "releaseNotes": open("app/release-notes.txt", encoding="utf-8").read().strip(),
              "tags": ["navigation"],
          }
          with open("out/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
          PY
          cat out/manifest.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.name }}
          name: Loo & Water ${{ steps.meta.outputs.name }}
          make_latest: true
          files: |
            out/LooWater-${{ steps.meta.outputs.name }}.apk
            out/LooWater.apk
            out/manifest.json
            out/icon.png
